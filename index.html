<!DOCTYPE html>
<html lang="id">
<!--
  ============================================================
  PORTOFOLIO DIGITAL — UNTUNG BILORO, S.T.
  Safety Coordinator / HSE Specialist
  ------------------------------------------------------------
  CARA MENGGUNAKAN
  1. Mode Edit : klik tombol "Mode Edit" di kanan atas.
                 - Klik teks mana pun untuk mengubahnya.
                 - Klik KARTU FOTO (kanan atas) untuk mengunggah
                   FOTO PROFIL Anda.
                 - Klik area BANNER "Zero Accident" untuk
                   mengunggah FOTO LATAR (background).
                 - Klik "Unduh HTML" untuk menyimpan berkas
                   final — foto sudah terbenam di dalamnya.
  2. Manual    : seluruh isi (termasuk foto, setelah diunggah)
                 terpusat pada blok JSON di dalam
                 <script id="cv-data">.
  3. Publikasi : unggah berkas ini secara gratis melalui
                 Netlify Drop (app.netlify.com/drop),
                 GitHub Pages, atau Vercel agar dapat dibuka
                 dari Google / dibagikan sebagai tautan.
  ============================================================
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untung Biloro, S.T. — Portofolio HSE / Safety Coordinator</title>
<meta name="description" content="Portofolio profesional Untung Biloro, S.T. — Safety Coordinator / HSE Specialist bersertifikasi Ahli K3 Umum BNSP & POP BNSP.">
<meta name="theme-color" content="#191813">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F1E9;
    --paper2:#EFEADB;
    --ink:#191813;
    --ink2:#57544A;
    --line:#D9D3C4;
    --accent:#E4570F;
    --accent-d:#C44708;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --sans:'Archivo',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--accent);color:#fff}
  a{color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px}
  section{scroll-margin-top:80px}

  /* ---- Strip hazard (identitas K3) ---- */
  .hz{height:8px;background:repeating-linear-gradient(-45deg,var(--ink) 0 12px,var(--accent) 12px 24px)}

  /* ---- Bilah atas ---- */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(244,241,233,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .tb-in{display:flex;align-items:center;gap:26px;height:62px}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none}
  .bmark{width:34px;height:34px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:700 12px var(--mono);transition:background .18s}
  .brand:hover .bmark{background:var(--accent)}
  .btxt{font:700 11px/1.35 var(--mono);letter-spacing:.08em;text-transform:uppercase}
  .btxt em{font-style:normal;font-weight:500;color:var(--ink2)}
  .nav{margin-left:auto;display:flex;gap:22px}
  .nav a{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);text-decoration:none;transition:color .15s}
  .nav a:hover{color:var(--ink)}
  .nav a.on{color:var(--accent)}
  .acts{display:flex;gap:10px}
  .btn{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:11px 15px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;transition:background .18s,color .18s,border-color .18s}
  .btn:hover{background:var(--ink);color:var(--paper)}
  .btn.solid{background:var(--ink);color:var(--paper)}
  .btn.solid:hover{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---- Hero ---- */
  .hero{position:relative;padding:92px 0 72px;overflow:hidden}
  .grid-bg{position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(25,24,19,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(25,24,19,.055) 1px,transparent 1px);
    background-size:54px 54px;
    -webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent 100%);
    mask-image:linear-gradient(to bottom,#000 55%,transparent 100%)}
  .hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:64px;align-items:start}
  .kicker{font:600 11px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
  .hname{font-stretch:125%;font-weight:800;line-height:.93;letter-spacing:-.015em;text-transform:uppercase;font-size:clamp(56px,10.5vw,138px);margin:18px 0 6px}
  .ln{display:block}
  .ln.out{color:transparent;-webkit-text-stroke:2.5px var(--ink)}
  @supports not (-webkit-text-stroke:1px #000){.ln.out{color:var(--ink)}}
  .lnwrap{display:block}
  .hdeg{font:700 clamp(14px,1.6vw,20px) var(--mono);letter-spacing:.05em;color:var(--accent);vertical-align:super;margin-left:12px;-webkit-text-stroke:0}
  .hrole{display:flex;align-items:center;gap:16px;margin-top:22px}
  .hrole .bar{width:46px;height:2px;background:var(--accent);flex:none}
  .hrole p{font-size:clamp(18px,2.4vw,26px);font-weight:600}
  .hmeta{margin-top:12px;font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
  .hfoot{display:flex;margin-top:52px}
  .cmini{width:min(390px,100%);border-top:2px solid var(--ink)}
  .cmini-t{font:700 10px var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--ink2);padding:10px 0 4px}
  .crow{display:flex;justify-content:space-between;gap:18px;padding:9px 0;border-bottom:1px solid var(--line);font:500 12px var(--mono);letter-spacing:.02em}
  .crow .cl{color:var(--ink2);text-transform:uppercase;letter-spacing:.14em;font-size:10.5px;font-weight:600;flex:none;padding-top:2px}
  .crow .cv{text-align:right;text-decoration:none;transition:color .15s}
  a.cv:hover{color:var(--accent)}

  /* ---- Kartu foto profil (gaya kartu identitas K3) ---- */
  .idcard{position:relative;border:2px solid var(--ink);background:#FDFCF8;box-shadow:14px 14px 0 var(--accent);cursor:default}
  body.editing .idcard{cursor:pointer}
  .idphoto{position:relative;aspect-ratio:4/5;background:var(--paper2);overflow:hidden;border-bottom:2px solid var(--ink)}
  .idphoto img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
  .idcard:hover .idphoto img{transform:scale(1.035)}
  .ph-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink2)}
  .ph-empty svg{width:64px;height:64px;fill:#C9C2AF}
  .ph-empty span{font:600 10.5px var(--mono);letter-spacing:.22em;text-transform:uppercase;border:1.5px dashed #C9C2AF;padding:8px 14px}
  .idtab{position:absolute;top:0;left:0;z-index:2;background:var(--accent);color:#fff;font:700 10px var(--mono);letter-spacing:.18em;padding:7px 12px}
  .ph-rm{position:absolute;top:8px;right:8px;z-index:3;width:30px;height:30px;border:1px solid rgba(244,241,233,.9);background:rgba(25,24,19,.82);color:#fff;font:700 13px/1 var(--mono);cursor:pointer;opacity:0;transition:opacity .15s,background .15s;display:none}
  body.editing .ph-rm{display:block}
  .idphoto:hover .ph-rm{opacity:1}
  .ph-rm:hover{background:#B3261E}
  .idinfo{padding:16px 16px 18px}
  .idlabel{font:700 9.5px var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
  .idname{font-stretch:115%;font-weight:800;text-transform:uppercase;font-size:21px;line-height:1.12}
  .idrole{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-top:7px}
  .idtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
  .idtag{font:600 9.5px/1.35 var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--ink);padding:5px 8px;color:var(--ink)}

  /* ---- Petunjuk edit (muncul saat Mode Edit) ---- */
  .edit-hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(25,24,19,.85);color:var(--paper);font:500 10.5px var(--mono);letter-spacing:.08em;padding:7px 12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:2;max-width:calc(100% - 20px);white-space:normal;text-align:center}
  body.editing .idphoto:hover .edit-hint{opacity:1}

  /* ---- Banner misi (foto latar) ---- */
  .banner{position:relative;min-height:460px;display:flex;align-items:center;overflow:hidden;background:var(--ink);isolation:isolate;cursor:default}
  body.editing .banner{cursor:pointer}
  .banner-bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center}
  .banner-bg.pattern{background-color:var(--ink);background-image:
    repeating-linear-gradient(-45deg,rgba(228,87,15,.07) 0 2px,transparent 2px 26px),
    linear-gradient(rgba(244,241,233,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(244,241,233,.05) 1px,transparent 1px);
    background-size:auto,54px 54px,54px 54px}
  .banner-veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,rgba(25,24,19,.9) 8%,rgba(25,24,19,.64) 55%,rgba(25,24,19,.48) 100%)}
  @media (min-width:981px){.banner-bg:not(.pattern){background-attachment:fixed}}
  .banner-in{position:relative;width:100%}
  .b-kick{display:flex;align-items:center;gap:14px;font:600 12px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:#F58B4B}
  .b-kick::before{content:"";width:46px;height:2px;background:var(--accent);flex:none}
  .b-hl{margin-top:16px;font-stretch:125%;font-weight:800;text-transform:uppercase;line-height:.95;letter-spacing:-.01em;font-size:clamp(46px,8.5vw,116px);color:var(--paper)}
  .b-rm{position:absolute;top:22px;right:26px;z-index:3;width:32px;height:32px;border:1px solid rgba(244,241,233,.7);background:rgba(25,24,19,.6);color:var(--paper);font:700 13px/1 var(--mono);cursor:pointer;opacity:0;transition:opacity .15s,background .15s;display:none}
  body.editing .b-rm{display:block}
  .banner:hover .b-rm{opacity:1}
  .b-rm:hover{background:#B3261E;border-color:#B3261E}
  .banner .edit-hint{left:auto;right:26px;bottom:20px;transform:none}
  body.editing .banner:hover .edit-hint{opacity:1}

  /* ---- Kerangka section ---- */
  .sec{padding:80px 0;border-top:1px solid var(--line)}
  .sec-head{display:flex;align-items:baseline;gap:18px;margin-bottom:46px}
  .sec-head .idx{font:700 12px var(--mono);letter-spacing:.12em;color:var(--accent)}
  .sec-head h2{font-stretch:115%;font-weight:750;text-transform:uppercase;font-size:clamp(25px,4vw,40px);letter-spacing:.01em}
  .sec-head .rule{flex:1;height:1px;background:var(--line);align-self:center}

  /* ---- 01 Profil ---- */
  .sum-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:60px;align-items:start}
  .sum-text p{font-size:clamp(17px,1.65vw,21px);line-height:1.72;color:#2B2921;max-width:62ch}
  .sum-text p + p{margin-top:1.15em}
  .core{border-left:3px solid var(--accent);padding:4px 0 4px 24px}
  .mpre{font:600 11.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);margin-bottom:14px}
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{font:600 12px/1 var(--mono);letter-spacing:.05em;padding:10px 13px;border:1.5px solid var(--ink);transition:background .15s,color .15s;display:inline-block}
  .chip:hover{background:var(--ink);color:var(--paper)}

  /* ---- 02 Pengalaman ---- */
  .job{display:grid;grid-template-columns:250px minmax(0,1fr);gap:46px;padding:40px 22px;margin:0 -22px;border-top:1px solid var(--line);transition:background .2s}
  .jobs .job:first-child{border-top:2px solid var(--ink)}
  .job:hover{background:var(--paper2)}
  .jmeta{font:500 12px/1.8 var(--mono);color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
  .jmeta .per{color:var(--ink);font-weight:700;display:flex;align-items:center}
  .dot{width:8px;height:8px;background:var(--accent);border-radius:50%;display:inline-block;margin-right:9px;animation:pulse 2.2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(228,87,15,.45)}50%{box-shadow:0 0 0 7px rgba(228,87,15,0)}}
  .jrole{font-stretch:112%;font-weight:750;line-height:1.15;font-size:clamp(22px,2.6vw,30px)}
  .jco{font:600 13px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:8px 0 18px}
  .jlist{list-style:none}
  .jlist li{position:relative;padding-left:27px;margin-bottom:10px;color:#34322A;max-width:74ch}
  .jlist li::before{content:"";position:absolute;left:0;top:.72em;width:14px;height:2px;background:var(--accent)}

  /* ---- 03 Sertifikasi ---- */
  .certs{list-style:none;border-top:2px solid var(--ink)}
  .cert{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:18px;padding:17px 20px;border-bottom:1px solid var(--line);transition:background .15s,color .15s}
  .cert:hover{background:var(--ink);color:var(--paper)}
  .cnum{font:700 12px var(--mono);color:var(--ink2);transition:color .15s}
  .cert:hover .cnum{color:var(--accent)}
  .cname{font-weight:600;font-size:clamp(15px,1.8vw,19px)}
  .ctag{font:700 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;padding:5px 10px;border:1px solid currentColor;white-space:nowrap}
  .ctag.bnsp{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---- 04 Keahlian ---- */
  .skgrid{display:grid;grid-template-columns:1fr 1fr;gap:56px}
  .sklabel{font:700 11px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);padding-bottom:10px;border-bottom:2px solid var(--ink);margin-bottom:8px}
  .sklist{list-style:none}
  .sklist li{display:flex;align-items:center;gap:13px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15.5px}
  .sklist li::before{content:"";width:7px;height:7px;background:var(--accent);flex:none}

  /* ---- 05 Pendidikan & Organisasi ---- */
  .edugrid{display:grid;grid-template-columns:5fr 7fr;gap:60px;align-items:start}
  .eyears{font:700 12px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-top:18px}
  .edegree{font-stretch:112%;font-weight:750;font-size:clamp(20px,2.4vw,27px);line-height:1.2;margin:8px 0 8px}
  .eschool{color:var(--ink2);font-size:15px;max-width:40ch}
  .org{padding:18px 0;border-bottom:1px solid var(--line)}
  .org:first-of-type{padding-top:0}
  .ohead{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
  .orole{font-weight:700;font-size:17px}
  .oper{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);flex:none}
  .oname{color:var(--accent);font-weight:600;font-size:14px;margin:3px 0 10px}
  .olist{list-style:none}
  .olist li{position:relative;padding-left:20px;margin-bottom:7px;color:#34322A;font-size:14.5px}
  .olist li::before{content:"";position:absolute;left:0;top:.72em;width:10px;height:2px;background:var(--accent)}

  /* ---- 06 Kontak & kaki ---- */
  .contact{padding-bottom:64px}
  .big{font-stretch:120%;font-weight:800;text-transform:uppercase;line-height:1.03;letter-spacing:-.012em;font-size:clamp(34px,5.4vw,66px);max-width:22ch}
  .big .acc{color:var(--accent)}
  .fnote{margin-top:20px;color:var(--ink2);max-width:62ch;font-size:15.5px}
  .clinks{margin-top:46px;border-top:2px solid var(--ink)}
  .clink{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 6px;border-bottom:1px solid var(--line);text-decoration:none;transition:background .18s}
  .clink:hover{background:var(--paper2)}
  .clink .lbl{font:600 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);flex:none}
  .clink .val{font-stretch:110%;font-weight:700;font-size:clamp(17px,2.8vw,29px);text-align:right;transition:color .18s}
  .clink .val.sm{font-size:clamp(14px,1.8vw,19px)}
  .clink:hover .val{color:var(--accent)}
  .clink .arr{font:700 22px var(--sans);color:var(--ink2);transition:transform .18s,color .18s;flex:none}
  .clink:hover .arr{transform:translateX(7px);color:var(--accent)}
  .clink.static{cursor:default}
  .clink.static:hover .val{color:inherit}
  .foot{border-top:1px solid var(--line);padding:22px 0 26px}
  .foot-in{display:flex;flex-wrap:wrap;gap:12px 26px;justify-content:space-between;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}

  /* ---- Mode Edit ---- */
  body.editing [data-k]{outline:1.5px dashed rgba(228,87,15,.55);outline-offset:3px;border-radius:1px;cursor:text;transition:outline-color .15s,background .15s}
  body.editing [data-k]:hover{outline-color:var(--accent);background:rgba(228,87,15,.06)}
  body.editing [data-k]:focus{outline:1.5px solid var(--accent);background:rgba(228,87,15,.07)}
  .editpanel{position:fixed;right:22px;bottom:22px;z-index:80;width:min(370px,calc(100vw - 44px));background:var(--ink);color:var(--paper);padding:20px;box-shadow:0 18px 50px rgba(20,18,10,.35);opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .25s,transform .25s}
  .editpanel.open{opacity:1;transform:none;pointer-events:auto}
  .ep-title{font:700 11px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
  .ep-desc{font-size:12.5px;line-height:1.6;color:rgba(244,241,233,.78);margin:10px 0 12px}
  .ep-status{font:500 10.5px var(--mono);letter-spacing:.08em;color:rgba(244,241,233,.6);border-top:1px solid rgba(244,241,233,.18);padding-top:10px;margin-bottom:14px}
  .ep-act{display:flex;gap:8px;flex-wrap:wrap}
  .ep-act + .ep-act{margin-top:8px}
  .ebtn{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:10px 13px;background:transparent;border:1px solid rgba(244,241,233,.35);color:var(--paper);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
  .ebtn:hover{background:var(--paper);color:var(--ink);border-color:var(--paper)}
  .ebtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .ebtn.primary:hover{background:var(--accent-d);border-color:var(--accent-d);color:#fff}
  .ebtn.dark{border-color:var(--ink);color:var(--ink)}
  .ebtn.dark:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .ebtn.danger{background:#B3261E;border-color:#B3261E;color:#fff}
  .ebtn.danger:hover{background:#8F1D17;border-color:#8F1D17;color:#fff}

  /* ---- Modal konfirmasi ---- */
  .modal{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:rgba(20,18,10,.55);padding:22px}
  .modal.open{display:grid}
  .mcard{background:var(--paper);border:1px solid var(--ink);max-width:420px;width:100%;padding:26px;box-shadow:0 24px 60px rgba(20,18,10,.4)}
  .mtitle{font-stretch:112%;font-weight:750;font-size:20px;margin-bottom:10px}
  .mdesc{font-size:14px;color:var(--ink2);line-height:1.6;margin-bottom:20px}
  .mact{display:flex;gap:10px;justify-content:flex-end}

  /* ---- Toast ---- */
  #toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:max-content;max-width:92vw}
  .toast{background:var(--ink);color:var(--paper);font:500 12.5px/1.5 var(--mono);padding:12px 18px;border-left:3px solid var(--accent);box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:min(560px,92vw);animation:tin .25s ease}
  .toast.out{opacity:0;transform:translateY(8px);transition:.3s}
  @keyframes tin{from{opacity:0;transform:translateY(10px)}}

  /* ---- Animasi muncul saat gulir ---- */
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
  .reveal.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .reveal{opacity:1;transform:none;transition:none}
    .dot{animation:none}
    .banner-bg:not(.pattern){background-attachment:scroll}
  }

  /* ---- Responsif ---- */
  @media (max-width:980px){
    .nav{display:none}
    .hero-grid{grid-template-columns:1fr;gap:44px}
    .idcard{max-width:340px;box-shadow:10px 10px 0 var(--accent)}
    .sum-grid,.skgrid,.edugrid{grid-template-columns:1fr;gap:40px}
    .job{grid-template-columns:1fr;gap:14px;padding:34px 14px;margin:0 -14px}
    .hfoot{justify-content:stretch}

  }

    a{text-decoration:none;color:inherit}

  /* ---------- sinkronisasi hasil editan ke DATA ---------- */
  function collectEdits(){
    var vals = {};
    document.querySelectorAll('[data-k]').forEach(function(el){
      var t = el.innerText.replace(/[\u00a0\n\t]/g,' ').replace(/\s{2,}/g,' ').trim();
      vals[el.getAttribute('data-k')] = t;
    });
    Object.keys(vals).forEach(function(path){ setPath(DATA, path, vals[path]); });

    /* tulis balik agar field yang berulang (telp/email/lokasi) tetap sinkron */
    document.querySelectorAll('[data-k]').forEach(function(el){
      var v = vals[el.getAttribute('data-k')];
      if(v != null && document.activeElement !== el){
        var cur = el.innerText.replace(/\s+/g,' ').trim();
        if(cur !== v) el.textContent = v;
      }
    });

    /* perbarui tautan WhatsApp & Email mengikuti teks terbaru */
    var digits = String(DATA.profile.phone||'').replace(/\D/g,'');
    document.querySelectorAll('.wa-link').forEach(function(a){ a.href = 'https://wa.me/' + digits; });
    document.querySelectorAll('.mail-link').forEach(function(a){ a.href = 'mailto:' + String(DATA.profile.email||'').trim(); });

    refreshEchoes();
  }

  function saveLocal(){
    collectEdits();
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); }catch(e){}
    var st = document.getElementById('epStatus');
    if(st) st.textContent = 'Tersimpan otomatis \u00b7 ' +
      new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  }

  function persist(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
    }catch(e){
      toast('Penyimpanan peramban penuh \u2014 foto tetap tampil, tetapi unduh HTML agar tidak hilang.');
    }
  }

  /* ---------- mode edit ---------- */
  function applyEditing(){
    document.body.classList.toggle('editing', editing);
    document.querySelectorAll('[data-k]').forEach(function(el){
      if(editing){ el.setAttribute('contenteditable','true'); el.spellcheck = false; }
      else{ el.removeAttribute('contenteditable'); }
    });
    var panel = document.getElementById('editPanel');
    if(panel) panel.classList.toggle('open', editing);
    var b = document.getElementById('btnEdit');
    if(b) b.textContent = editing ? 'Selesai Edit' : 'Mode Edit';
  }
  function setEditing(on){
    editing = on;
    applyEditing();
    if(on){
      var st = document.getElementById('epStatus');
      if(st) st.textContent = 'Mode edit aktif \u2014 silakan klik teks / foto untuk mengubah.';
    }
  }

  /* ---------- ekspor HTML (unduh berkas hasil editan + foto) ---------- */
  function buildExportHTML(){
    collectEdits();
    var clone = document.documentElement.cloneNode(true);
    var cbody = clone.querySelector('body');
    cbody.classList.remove('editing');
    clone.querySelectorAll('[contenteditable]').forEach(function(el){ el.removeAttribute('contenteditable'); });
    clone.querySelectorAll('.reveal.in').forEach(function(el){ el.classList.remove('in'); });
    clone.querySelectorAll('.nav a.on').forEach(function(el){ el.classList.remove('on'); });
    clone.querySelectorAll('#toasts .toast').forEach(function(el){ el.remove(); });
    var panel = clone.querySelector('#editPanel'); if(panel) panel.classList.remove('open');
    var modal = clone.querySelector('#modal');     if(modal) modal.classList.remove('open');
    var fin = clone.querySelector('#fileProfile'); if(fin) fin.setAttribute('hidden','');
    var fb  = clone.querySelector('#fileBg');      if(fb)  fb.setAttribute('hidden','');
    var finv = clone.querySelector('#fileProfileValue'); if(finv) finv.remove();
    var fbv  = clone.querySelector('#fileBgValue');      if(fbv)  fbv.remove();
    var sc = clone.querySelector('#cv-data');
    if(sc) sc.textContent = JSON.stringify(DATA, null, 2);
    return '<!DOCTYPE html>\n' + clone.outerHTML;
  }

  /* ---------- pemrosesan foto unggahan ---------- */
  function processImage(file, maxW, quality, cb){
    if(!file || !/^image\//.test(file.type)){ toast('Berkas yang dipilih bukan gambar.'); return; }
    var fr = new FileReader();
    fr.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var sc = Math.min(1, maxW / img.width);
        var w = Math.max(1, Math.round(img.width * sc));
        var h = Math.max(1, Math.round(img.height * sc));
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        try{ cb(cv.toDataURL('image/jpeg', quality)); }
        catch(e){ toast('Gagal memproses gambar. Coba gambar lain.'); }
      };
      img.onerror = function(){ toast('Gagal membaca gambar.'); };
      img.src = ev.target.result;
    };
    fr.readAsDataURL(file);
  }

  function handleProfile(file){
    processImage(file, 900, .85, function(url){
      DATA.photos.profile = url;
      persist(); render();
      toast('Foto profil diperbarui & tersimpan. Jangan lupa "Unduh HTML" agar ikut tersimpan di berkas.');
    });
  }
  function handleBg(file){
    processImage(file, 1600, .8, function(url){
      DATA.photos.bg = url;
      persist(); render();
      toast('Foto latar diperbarui & tersimpan. Jangan lupa "Unduh HTML" agar ikut tersimpan di berkas.');
    });
  }

  /* ---------- render + pasang interaksi ---------- */
  function render(){
    document.getElementById('app').innerHTML = buildHTML(DATA);
    bind();
    setupReveal();
    setupSpy();
    applyEditing();
    refreshEchoes();
  }

  function bind(){
    document.getElementById('btnPrint').addEventListener('click', function(){ window.print(); });
    document.getElementById('btnEdit').addEventListener('click', function(){ setEditing(!editing); });
    document.getElementById('btnDone').addEventListener('click', function(){ setEditing(false); toast('Mode edit dimatikan. Perubahan tetap tersimpan di peramban ini.'); });

    document.getElementById('btnUpProfile').addEventListener('click', function(){
      document.getElementById('fileProfile').click();
    });
    document.getElementById('btnUpBg').addEventListener('click', function(){
      document.getElementById('fileBg').click();
    });

    document.getElementById('btnDownload').addEventListener('click', function(){
      var html = buildExportHTML();
      var blob = new Blob([html], {type:'text/html;charset=utf-8'});
      var url  = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'portofolio-untung-biloro.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      toast('Berkas portofolio (termasuk foto) berhasil diunduh. Unggah ke Netlify Drop / GitHub Pages agar dapat dilihat daring.');
    });

    document.getElementById('btnReset').addEventListener('click', function(){
      document.getElementById('modal').classList.add('open');
    });
    document.getElementById('mNo').addEventListener('click', function(){
      document.getElementById('modal').classList.remove('open');
    });
    document.getElementById('mYes').addEventListener('click', function(){
      try{ localStorage.removeItem(STORE_KEY); }catch(e){}
      DATA = withDefaults(JSON.parse(JSON.stringify(DEF)));
      document.getElementById('modal').classList.remove('open');
      render();
      toast('Redaksi asli telah dipulihkan.');
    });

    /* klik kartu foto (di Mode Edit) untuk unggah */
    var pbox = document.getElementById('photoProfileBox');
    if(pbox) pbox.addEventListener('click', function(e){
      if(!editing) return;
      if(e.target.closest && e.target.closest('[data-k]')) return;
      if(e.target.closest && e.target.closest('button')) return;
      document.getElementById('fileProfile').click();
    });
    var rmP = document.getElementById('rmProfile');
    if(rmP) rmP.addEventListener('click', function(e){
      e.stopPropagation();
      DATA.photos.profile = '';
      persist(); render();
      toast('Foto profil dihapus.');
    });

    /* klik area kosong banner (di Mode Edit) untuk unggah foto latar */
    var bannerEl = document.getElementById('misi');
    if(bannerEl) bannerEl.addEventListener('click', function(e){
      if(!editing) return;
      if(e.target.closest && e.target.closest('[data-k]')) return;
      if(e.target.closest && e.target.closest('button')) return;
      document.getElementById('fileBg').click();
    });
    var rmB = document.getElementById('rmBg');
    if(rmB) rmB.addEventListener('click', function(e){
      e.stopPropagation();
      DATA.photos.bg = '';
      persist(); render();
      toast('Foto latar dihapus.');
    });
  }

  /* ---------- interaksi halaman ---------- */
  function setupReveal(){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(en){
        if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
      });
    }, {threshold:.06, rootMargin:'0px 0px -6% 0px'});
    document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });
  }

  function setupSpy(){
    var links = Array.prototype.slice.call(document.querySelectorAll('.nav a'));
    var map = {};
    links.forEach(function(a){ map[a.getAttribute('href').slice(1)] = a; });
    var io = new IntersectionObserver(function(es){
      es.forEach(function(en){
        if(en.isIntersecting){
          links.forEach(function(l){ l.classList.remove('on'); });
          var el = map[en.target.id];
          if(el) el.classList.add('on');
        }
      });
    }, {rootMargin:'-40% 0px -55% 0px'});
    Object.keys(map).forEach(function(id){
      var s = document.getElementById(id);
      if(s) io.observe(s);
    });
  }

  /* ---------- listener global (tetap terpasang lintas render) ---------- */
  document.getElementById('fileProfile').addEventListener('change', function(){
    handleProfile(this.files && this.files[0]);
    this.value = '';
  });
  document.getElementById('fileBg').addEventListener('change', function(){
    handleBg(this.files && this.files[0]);
    this.value = '';
  });

  document.addEventListener('input', function(e){
    if(!editing) return;
    if(e.target.closest && e.target.closest('[data-k]')){
      clearTimeout(saveTimer);
      var st = document.getElementById('epStatus');
      if(st) st.textContent = 'Menyimpan\u2026';
      saveTimer = setTimeout(saveLocal, 700);
    }
  });

  document.addEventListener('keydown', function(e){
    if(editing && e.key === 'Enter' && e.target.closest && e.target.closest('[data-k]')){
      e.preventDefault();
      e.target.blur();
    }
  });

  document.addEventListener('paste', function(e){
    if(!editing) return;
    if(!(e.target.closest && e.target.closest('[data-k]'))) return;
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain').replace(/\s+/g,' ');
    document.execCommand('insertText', false, text);
  });

  /* ---------- mulai ---------- */
  render();
  if(fromStore){
    setTimeout(function(){
      toast('Perubahan terakhir (teks & foto) dari perangkat ini telah dimuat. Buka "Mode Edit" untuk mengubah atau memulihkan redaksi asli.');
    }, 900);
  } else {
    setTimeout(function(){
      toast('Tips: aktifkan "Mode Edit" untuk mengunggah foto profil dan foto latar, lalu "Unduh HTML".');
    }, 900);
  }
})();
</script>
